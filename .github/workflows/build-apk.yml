name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew

      - name: Build and test Debug APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK when signing is configured
        id: release_apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            ./gradlew :app:assembleRelease --console=plain
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK
        if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Descarga app-debug.apk e instalalo en tu telefono Android.

          Para jugar sin registro ni pareja, pulsa **Probar sin cuenta**.
          La base de datos se crea dentro del telefono; no requiere servidor local.
          NOTES
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          FILES=(app/build/outputs/apk/debug/app-debug.apk)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            FILES+=(app/build/outputs/apk/release/app-release.apk)
          fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "Pruebas $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
